# Differences between Julia's C++ passes and the ports that are known and decided, for
# test/differential/run.jl. One array of tables per pass (Julia's name):
#
#   [[Pass]]
#   input = "llvmpasses/*.ll"   # glob over input names (default: every input)
#   julia = ["1.10", "1.11"]    # dialects it applies to (default: all); a Julia newer
#                               # than the known versions has the newest one's
#   prefix = "raw"              # the prefix pipeline it applies to (default: all)
#   side = "cpp"                # whose output it rewrites: "cpp", "port" or "both"
#   lines = '...'               # a regex over the lines of that output
#   replace = '...'             # what the matched text becomes (\1 etc. for groups);
#                               # without it, matching lines are deleted
#   reason = "..."              # what differs and why
#   decision = "S-D3"           # the plan decision (or Log entry) that settled it
#
# The outputs are compared line by line (blank lines ignored) after the rewrites of every
# exception that applies, and the difference is excepted only if they are then identical:
# an exception allows exactly the change it describes, anywhere else the outputs must
# agree. Errors, crashes and invalid IR are status lines of the output, starting with `! `.
#
# For a deviation that changes too much of a module to be rewritten away (the C++ output
# is invalid IR, or the port's analysis differs), an exception can instead have
# `accept = '...'` (a regex) in place of `lines`, and should then name its inputs: the
# difference is excepted when a line of that side's output matches and the other side's
# output is a module that verifies. And for a deviation that a regex can't describe,
# `canonicalize = "..."` names a rewrite in run.jl's CANONICALIZATIONS (e.g. "frame
# slots", which names GC frame slots by their first use and hides their indices).

[[AllocOpt]]
input = "llvmpasses/late-lower-gc-addrspaces.ll"
julia = ["1.10", "1.11"]
side = "cpp"
accept = '^! invalid IR: LLVM error: Invalid bitcast \| %\d+ = bitcast ptr addrspace\(5\) %\d+ to ptr \|'
reason = "for an alloca in a non-zero address space, the C++ of 1.10 and 1.11 casts it to address space 0 with a bitcast (invalid IR); the port uses the alloca as is"
decision = "S-D3 (Log, S4, exception 4)"

# The port uses Julia 1.13's escape analysis on every version: fields that don't overlap
# are not merged (JuliaLang/julia#62166); allocations with references can be split or
# removed (#61131); cmpxchg/atomicrmw moved onto the slots of a split allocation are made
# non-atomic (#61131); a field touched only by an atomicrmw/cmpxchg gets a stack slot
# (#62752; 1.12's C++ crashes without it); storing the allocation's address with an
# atomic is an escape. So on 1.10 to 1.12 the port removes or splits allocations that the
# C++ keeps.
[[AllocOpt]]
input = "corpus/alloc_refpair*"
julia = ["1.10", "1.11", "1.12"]
side = "cpp"
accept = '^  %\d+ = call [^@]*@julia\.gc_alloc_obj\('
reason = "the C++ of 1.10 to 1.12 keeps an allocation with references and atomic accesses, which the port (1.13's escape analysis) removes or splits"
decision = "S-D30"

[[AllocOpt]]
input = "corpus/preserve_ref*"
julia = ["1.10", "1.11", "1.12"]
side = "cpp"
accept = '^  %\d+ = call [^@]*@julia\.gc_alloc_obj\('
reason = "as for alloc_refpair: an allocation initialized with an atomic store"
decision = "S-D30"

[[AllocOpt]]
input = "llvmpasses/gc-writebarrier-volatile.ll"
julia = ["1.12", "1.13"]
side = "port"
lines = '^  call void @julia\.write_barrier\(ptr addrspace\(10\) %\d+, ptr addrspace\(10\) null\)$'
reason = "a write barrier whose child is a removed allocation keeps its other operands, as on Julia 1.14 (the C++ of earlier versions erases the barrier)"
decision = "S-D3 (Log, S4, exception 1)"

[[GCInvariantVerifier]]
input = "inputs/gc-ptrtoint.ll"
julia = ["1.10", "1.11", "1.12", "1.13"]
side = "cpp"
lines = '^! rejected \| Illegal inttoptr \| (%\w+ = ptrtoint ptr addrspace\(1[0-3]\) .*)$'
replace = '! rejected | Illegal ptrtoint | \1'
reason = "a ptrtoint of a tracked pointer is reported as \"Illegal ptrtoint\", as on Julia 1.14 (earlier versions say \"Illegal inttoptr\")"
decision = "S-D3 (Log, S5 GCInvariantVerifier)"

[["GCInvariantVerifier<strong>"]]
input = "inputs/gc-ptrtoint.ll"
julia = ["1.10", "1.11", "1.12", "1.13"]
side = "cpp"
lines = '^! rejected \| Illegal inttoptr \| (%\w+ = ptrtoint ptr addrspace\(1[0-3]\) .*)$'
replace = '! rejected | Illegal ptrtoint | \1'
reason = "as for GCInvariantVerifier"
decision = "S-D3 (Log, S5 GCInvariantVerifier)"

[[LateLowerGCFrame]]
input = "llvmpasses/alloc-opt-gcframe.ll"
side = "port"
lines = '^(  call void %\d+\(ptr (nonnull )?%\d+\)) \[ "(unknown_bundle|jl_not_jl_roots)"\(.*\) \]$'
replace = '\1'
reason = "operand bundles that are not Julia's are kept (the C++ removes every bundle of the calls it rewrites)"
decision = "S6b deviation (docs/src/late_lower_gc_frame.md)"

[[LateLowerGCFrame]]
julia = ["1.12", "1.13"]
side = "cpp"
lines = '^(  (%\d+ = load atomic i8, ptr %\d+ monotonic|store atomic i8 (%\d+|\d+), ptr %\d+ release)), align 8\b'
replace = '\1, align 1'
reason = "the GC state byte is accessed with an alignment it has (the C++ of 1.12 and 1.13 claims that of a pointer)"
decision = "S6b deviation (docs/src/late_lower_gc_frame.md)"

[[LateLowerGCFrame]]
input = "llvmpasses/late-lower-gc-s*.ll"
side = "both"
canonicalize = "frame slots"
reason = "the frame slots of allocas are in the order of the function; the C++ orders them by address (a pointer-keyed map), so its order changes between runs"
decision = "S6b deviation (docs/src/late_lower_gc_frame.md)"

[[LateGCCleanup]]
julia = ["1.12", "1.13", "1.14"]
side = "cpp"
lines = '^declare noalias nonnull ptr addrspace\(10\) @ijl_gc_small_alloc\(ptr, i32, i32, i64\) #\{ nounwind willreturn allockind\("alloc"\) allocsize\(2\) memory\(argmem: read, inaccessiblemem: readwrite\) \}$'
reason = "no declaration of ijl_gc_small_alloc (the C++ of 1.12 and later declares it in every module)"
decision = "S6 contract (docs/src/late_lower_gc_frame.md)"

[[LateGCCleanup]]
input = "llvmpasses/alloc-opt-gcframe.ll"
side = "port"
lines = '^(  call void %\d+\(ptr (nonnull )?%\d+\)) \[ "(unknown_bundle|jl_not_jl_roots)"\(.*\) \]$'
replace = '\1'
reason = "operand bundles that are not Julia's are kept (the C++ removes every bundle of the calls it rewrites)"
decision = "S6b deviation (docs/src/late_lower_gc_frame.md)"

[[LateGCCleanup]]
input = "corpus/gc_safe_call*"
julia = ["1.12", "1.13", "1.14"]
side = "port"
lines = '^! error: UnsupportedInputError: function \S+ contains constructs that LateGCCleanup does not support( \| gc-transition operand bundle: GC state transitions need Julia.s runtime( \(at [^()|]*\))? \| [^|]+)+$'
replace = '! ok'
reason = "GC state transitions are outside the input contract of jl-late-gc-cleanup (GPU code has none)"
decision = "S6 contract (docs/src/late_lower_gc_frame.md)"

[[LateGCCleanup]]
input = "llvmpasses/final-lower-gc*.ll"
side = "port"
lines = '^! error: UnsupportedInputError: function \S+ contains constructs that LateGCCleanup does not support( \| julia\.\w+: GC frames and allocations of Julia.s runtime are lowered by FinalLowerGC( \(at [^()|]*\))? \| [^|]+)+$'
replace = '! ok'
reason = "IR with GC frames (the output of LateLowerGCFrame) is outside the input contract of jl-late-gc-cleanup"
decision = "S6 contract (docs/src/late_lower_gc_frame.md)"
