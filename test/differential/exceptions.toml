# The deviations of the ports that only run in the comparison of Julia's pipeline, which
# inherits them (they have no comparison of their own here).

[[FinalLowerGC]]
julia = ["1.10", "1.11", "1.12", "1.13"]
side = "port"
lines = '^(  call void @llvm\.memset\.p0\.i64\(ptr )(?:noundef nonnull )?(align \d+ )(?:dereferenceable\(\d+\) )?(%\d+, i8 0, i64 \d+), i1 false\), !tbaa !\d+$'
replace = '\1\2\3, i1 true)'
reason = "the GC frame is zeroed by a non-volatile memset with the frame's TBAA tag, as from Julia 1.14 on (the C++ of 1.10 to 1.13 passes the tag as the volatility flag), which later passes may annotate"
decision = "FinalLowerGC deviation (docs/src/final_lower_gc.md, JuliaLang/julia#62061)"

[[FinalLowerGC]]
julia = ["1.10"]
side = "both"
lines = '^(  %\d+ = call noalias nonnull )dereferenceable\(\d+\) (ptr addrspace\(10\) @ijl_gc_(?:pool|big|small)_alloc\w*\(.*)$'
replace = '\1\2'
reason = "an allocation of a constant size is dereferenceable for the object's size, as from Julia 1.11 on; the C++ of 1.10 claims the size of the pool's objects, or of a big allocation, which can't be derived from the port's"
decision = "docs/src/final_lower_gc.md: Fixes of later Julia versions (JuliaLang/julia#51218)"

[[FinalLowerGC]]
side = "both"
canonicalize = "GC frame push order"
reason = "the previous-frame load and address are independent arguments of a C++ builder call, so their instruction order depends on the compiler that built Julia"
decision = "src/passes/final_lower_gc.jl: lower_push_gc_frame!"

[[LowerPTLSPass]]
side = "port"
accept = '^! error: LowerPTLSError: can.t read the thread pointer for target '
reason = "the port refuses to read the thread pointer of a target it can't read it on; the C++ reaches llvm_unreachable, which release builds turn into x86 assembly"
decision = "LowerPTLS deviation (docs/src/lower_ptls.md)"

[[LowerPTLSPass]]
input = "gpucompiler/*"
julia = ["1.14", "1.15"]
side = "both"
lines = '^! (crashed \| .*|error: LowerPTLSError: can.t read the thread pointer for target .*)$'
replace = '! no thread pointer'
reason = "as above, where the C++'s llvm_unreachable crashes instead"
decision = "LowerPTLS deviation (docs/src/lower_ptls.md)"

[[RemoveJuliaAddrspaces]]
