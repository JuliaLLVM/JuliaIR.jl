# Coverage manifest for Julia's own pass tests (test/llvmpasses), run by run.jl.
#
# [pins.<minor>]: the latest release tag and commit for each Julia minor, and its
# bundled LLVM major. Unreleased versions omit `commit`: their fixtures come from
# the running build's Base.GIT_VERSION_INFO.commit. A prerelease newer than all pins
# uses the newest pin if that pin has no commit.
#
# Native runs use Julia's bundled LLVM. Standalone runs use the selected LLVM and
# apply compatibility patches generated by derive.jl for that LLVM version.
# Reference checks validate pristine fixtures with Julia's C++ passes, optionally
# reprinting their output with a newer LLVM to validate those compatibility patches.
#
# [fixtures."<file>"]: every file in test/llvmpasses of any pin, with
#   kind    = "port"     tests passes that this package ports (`ports`, Julia's names)
#             "mixed"    tests ported passes together with Julia's passes that are not
#                        ported yet
#             "cpu"      tests CPU-only passes that are not ported
#             "emitter"  tests Julia's code generator, not a pass
#             "infra"    not a test
#   status  = "run"      run with the ports (Julia's names are mapped to them)
#             "skip"     not yet: `missing` lists the passes whose ports don't exist yet
#             "exclude"  not relevant to this package (`reason`)
#             "override" run a derived copy: `patch` (relative to this file) is applied
#                        to the fixture first; the run fails if the pristine fixture
#                        passes too (the override is stale)
#             "derived"  run a copy that tests a port instead of what the fixture
#                        tests: `patch` is applied to the fixture first (e.g., with the
#                        pipeline naming a port); the copy must run a port
#   reason  = why, for skip/exclude/override; `ref` = upstream reference, if any
#   cpp     = why the fixture does not run with Julia's C++ passes (`run.jl --reference`, which
#             otherwise runs every fixture that does not test the code generator)
#   ledger_empty = ports that a fixture runs, but on IR they don't apply to (so the ledger
#             shows no run of them)
# A table [fixtures."<file>".pins.<minor>] overrides these keys for one pin.
#
# Independently of the status, run.jl skips the RUN lines of a fixture that use typed
# pointers (`--opaque-pointers=0`), and translates legacy pass manager
# lines (`-enable-new-pm=0`) when they use opaque pointers. Standalone runs also skip
# RUN lines that name Julia's C++ passes without a port, and apply patches from
# llvm-compat/llvm<major>/<minor> after the port patch (see derive.jl).

[pins."1.10"]
tag = "v1.10.12"
commit = "d93beab124c850d5f600f290069853e81413f7ca"
julia = "1.10.12"
llvm = 15

[pins."1.11"]
