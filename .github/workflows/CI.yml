name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: '23.1.4'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Select Julia versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      coverage: ${{ steps.versions.outputs.coverage }}
      llvm-major: ${{ steps.versions.outputs.llvm-major }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - id: versions
        run: julia --startup-file=no test/ci/versions.jl

  native:
    name: Julia ${{ matrix.julia.version }} / ${{ matrix.os }}
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        julia: ${{ fromJSON(needs.versions.outputs.matrix) }}
        os: ['ubuntu-latest', 'macOS-latest', 'windows-latest']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.julia.version == needs.versions.outputs.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia.version == needs.versions.outputs.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.julia.version == needs.versions.outputs.coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: lcov.info
      # Compare every dialect with its own C++ implementation on Linux.
      - name: Determine the fixture commit
        if: matrix.os == 'ubuntu-latest'
        id: fixtures
        env:
          PINNED_REF: ${{ matrix.julia.ref }}
        run: |
          ref="$PINNED_REF"
          [ -n "$ref" ] || ref=$(julia --startup-file=no -e 'print(Base.GIT_VERSION_INFO.commit)')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          repository: JuliaLang/julia
          ref: ${{ steps.fixtures.outputs.ref }}
          path: julia-src
          sparse-checkout: |
            test/llvmpasses
            test/testhelpers
      - name: Install comparison dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          for project in test test/differential; do
            julia --project="$project" -e 'using Pkg; VERSION < v"1.12" && Pkg.develop(path=pwd()); Pkg.instantiate()'
          done
      - name: Check upstream expectations against Julia's C++ passes
        if: matrix.os == 'ubuntu-latest'
        run: julia --project=test test/upstream/run.jl julia-src --reference
      - name: Check upstream expectations against the ports
        if: matrix.os == 'ubuntu-latest'
        run: julia --project=test test/upstream/run.jl julia-src
      - name: Compare the ports with Julia's C++ passes
        if: matrix.os == 'ubuntu-latest'
        run: |
          julia --project=test/differential test/differential/corpus.jl corpus
          julia --project=test/differential test/differential/run.jl --quiet --out differential julia-src/test/llvmpasses corpus test/differential/inputs
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.os == 'ubuntu-latest'
        with:
          name: differential-${{ matrix.julia.version }}
          path: differential

  standalone-llvm:
    name: Build a standalone LLVM 23
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      # Build LLVMExtra from the LLVM.jl release used by the tests.
      - name: Install LLVM.jl
        id: llvm-jl
        shell: julia --project --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
          llvm = only(p for p in values(Pkg.dependencies()) if p.name == "LLVM")
          open(ENV["GITHUB_OUTPUT"], "a") do io
              println(io, "dir=", llvm.source)
              println(io, "version=", llvm.version)
          end
      # the build's inputs; bump the revision when the steps below change what they produce
      - name: Determine the cache key
        id: key
        env:
          LLVM_JL: ${{ steps.llvm-jl.outputs.version }}
        run: echo "key=standalone-llvm$LLVM_VERSION-r4-llvmjl$LLVM_JL-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: standalone
          key: ${{ steps.key.outputs.key }}
      # from a copy of the installed package's deps/, as the script instantiates its
      # environment there
      - name: Build the standalone library
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          LLVM_JL: ${{ steps.llvm-jl.outputs.dir }}
        run: |
          cp -r "$LLVM_JL/deps" "$RUNNER_TEMP/llvm-deps"
          chmod -R u+w "$RUNNER_TEMP/llvm-deps"
          julia --project="$RUNNER_TEMP/llvm-deps" "$RUNNER_TEMP/llvm-deps/build_standalone.jl" "$LLVM_VERSION" "$PWD/standalone"
      # LLVM_full_jll's tools find libLLVM in ../lib (the build step downloaded the JLL)
      - name: Add the LLVM tools
        if: steps.cache.outputs.cache-hit != 'true'
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp=true)
          Pkg.add(; name="LLVM_full_jll", version=ENV["LLVM_VERSION"])
          using LLVM_full_jll
          src = LLVM_full_jll.artifact_dir
          mkpath("standalone/tools")
          # all of LLVM's tools (not those of clang, which make up most of the directory), as
          # the tests and Julia's fixtures use any of them
          for tool in readdir(joinpath(src, "tools"))
              tool in ("opt", "llc", "FileCheck", "not", "count", "split-file") ||
                  startswith(tool, "llvm-") || continue
              cp(joinpath(src, "tools", tool), joinpath("standalone/tools", tool))
          end
          for lib in readdir(joinpath(src, "lib"))
              # the versioned name that the tools link, not the unversioned symlink
              startswith(lib, "libLLVM.so.") || continue
              cp(joinpath(src, "lib", lib), joinpath("standalone/lib", lib); follow_symlinks=true)
          end
          run(`standalone/tools/llvm-dis --version`)
      # an archive, as artifacts don't keep the tools' permissions
      - name: Archive the library and tools
        run: tar -cf standalone.tar standalone
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-llvm
          path: standalone.tar
          retention-days: 1

  compatibility:
    name: Julia ${{ matrix.julia.version }} IR / LLVM ${{ needs.versions.outputs.llvm-major }}
    needs: [versions, standalone-llvm]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        julia: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      LLVM_MAJOR: ${{ needs.versions.outputs.llvm-major }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia.version }}
      - uses: julia-actions/cache@v3
      - uses: actions/download-artifact@v8
        with:
          name: standalone-llvm
          path: ${{ runner.temp }}
      - name: Unpack the standalone LLVM
        run: |
          tar -xf "$RUNNER_TEMP/standalone.tar" -C "$RUNNER_TEMP"
          echo "STANDALONE_LIBRARY=$RUNNER_TEMP/standalone/lib/libLLVM-standalone-$LLVM_MAJOR.so" >> "$GITHUB_ENV"
      - name: Check the LLVM versions
        shell: julia --startup-file=no {0}
        run: |
          Base.libllvm_version.major <= parse(Int, ENV["LLVM_MAJOR"]) ||
              error("Julia uses LLVM $(Base.libllvm_version); update LLVM_VERSION in CI.yml")
      - name: Determine the fixture commit
        id: fixtures
        env:
          PINNED_REF: ${{ matrix.julia.ref }}
        run: |
          ref="$PINNED_REF"
          [ -n "$ref" ] || ref=$(julia --startup-file=no -e 'print(Base.GIT_VERSION_INFO.commit)')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: JuliaLang/julia
          ref: ${{ steps.fixtures.outputs.ref }}
          path: julia-src
          sparse-checkout: |
            test/llvmpasses
            test/testhelpers
      - name: Install test dependencies
        run: |
          for project in test test/differential; do
            julia --project="$project" -e 'using Pkg; VERSION < v"1.12" && Pkg.develop(path=pwd()); Pkg.instantiate()'
          done
      # Keep the reference on Julia's LLVM. Only reprint its output with the newer LLVM.
      - name: Check LLVM fixture adaptations against Julia's C++ passes
        run: julia --project=test test/upstream/run.jl julia-src --reference-llvm "$RUNNER_TEMP/standalone/tools/opt"
      - name: Generate this Julia version's IR corpus
        run: julia --project=test/differential test/differential/corpus.jl corpus
      # Pkg.test on Julia 1.10 can't merge a test manifest that develops the package
      - name: Remove the test manifest
        run: rm -f test/Manifest*.toml
      # Exercise library switching after the package was loaded with Julia's LLVM.
      - name: Test both LLVM libraries in one process
        run: julia --project -e 'using Pkg; Pkg.test()'
        env:
          JULIAIR_TEST_LIBRARY: ${{ env.STANDALONE_LIBRARY }}
      - name: Select the standalone LLVM for all test processes
        run: |
          for dir in . test docs test/differential; do
            printf '[LLVM]\nlibLLVM = "%s"\n' "$STANDALONE_LIBRARY" > "$dir/LocalPreferences.toml"
          done
          echo "JULIAIR_LLVM_TOOLS=$RUNNER_TEMP/standalone/tools" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - name: Check the selected library
        shell: julia --project --startup-file=no {0}
        run: |
          using LLVM
          (!LLVM.julia_llvm && LLVM.version().major == parse(Int, ENV["LLVM_MAJOR"])) ||
              error("LLVM.jl loaded the wrong library: $(LLVM.version()), julia_llvm=$(LLVM.julia_llvm)")
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
      - name: Reinstall test dependencies
        run: julia --project=test -e 'using Pkg; VERSION < v"1.12" && Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Run upstream fixtures on the standalone LLVM
        run: julia --project=test test/upstream/run.jl julia-src
      - name: Process the generated IR with the standalone LLVM
        run: julia --project=test test/compatibility/run.jl corpus
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compatibility-${{ matrix.julia.version }}
          path: corpus

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # Documenter deploys to gh-pages with the GITHUB_TOKEN, or DOCUMENTER_KEY when set
    permissions:
      contents: write
      statuses: write   # report the deployed preview on pull requests
      pull-requests: write  # link the preview from pull requests that change the docs
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl

      # Documenter only reports the preview as a commit status, which is easy to miss, so
      # link it from pull requests that change the documentation. Pull requests from forks
      # don't get a preview.
      - name: Link the preview
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const files = await github.paginate(github.rest.pulls.listFiles,
                                                {owner, repo, pull_number: issue_number, per_page: 100});
            if (!files.some(file => file.filename.startsWith('docs/'))) {
              return;
            }
            const marker = '<!-- documentation-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments,
                                                   {owner, repo, issue_number, per_page: 100});
            if (comments.some(comment => comment.body?.startsWith(marker))) {
              return;
            }
            const url = `https://juliallvm.github.io/JuliaIR.jl/previews/PR${issue_number}/`;
            await github.rest.issues.createComment({owner, repo, issue_number,
                                                   body: `${marker}\nDocumentation preview: ${url}`});
