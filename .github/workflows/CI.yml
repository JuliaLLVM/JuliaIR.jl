name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13', '1.14-nightly', 'nightly']
        os: ['ubuntu-latest', 'macOS-latest', 'windows-latest']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version != 'nightly' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version != 'nightly'
      - uses: codecov/codecov-action@v7
        if: matrix.version != 'nightly'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: lcov.info

  # Julia's own pass tests, at the commits pinned in test/upstream/manifest.toml (the
  # job checks that the refs here match), with the Julia build they belong to; for the
  # nightly builds (master, and release branches before their first tag), at the commit
  # they were built from
  upstream:
    name: Julia ${{ matrix.version }} - upstream llvmpasses
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1.10.12', julia_ref: 'd93beab124c850d5f600f290069853e81413f7ca'}  # v1.10.12
          - {version: '1.11.9', julia_ref: '53a02c0720cdc5d7fc0f35447886dd14bb2491a6'}   # v1.11.9
          - {version: '1.12.7', julia_ref: '6d172b025e4befc4d274d9fbc9339917a8a86b65'}   # v1.12.7
          - {version: '1.13.2', julia_ref: '45b6d15e34bbd2003a31acce0b1847b63dad029c'}   # v1.13.2
          - {version: '1.14-nightly', julia_ref: ''}  # release-1.14
          - {version: 'nightly', julia_ref: ''}  # master
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: Determine the fixtures' commit
        id: fixtures
        run: |
          ref='${{ matrix.julia_ref }}'
          [ -n "$ref" ] || ref=$(julia --startup-file=no -e 'print(Base.GIT_VERSION_INFO.commit)')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: JuliaLang/julia
          ref: ${{ steps.fixtures.outputs.ref }}
          path: julia-src
          sparse-checkout: |
            test/llvmpasses
            test/testhelpers
          sparse-checkout-cone-mode: true
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        # Julia 1.10 and 1.11 don't support workspaces
        run: julia --project=test -e 'using Pkg; VERSION < v"1.12" && Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Run the fixtures with the ports
        run: julia --project=test test/upstream/run.jl julia-src --mode A
      - name: Run the fixtures with Julia's passes
        run: julia --project=test test/upstream/run.jl julia-src --cpp
      # the ports against Julia's C++ passes (test/differential) on the fixtures and a
      # code_llvm corpus, on 1.12, 1.14 and master (test/differential/all.sh covers every
      # version, and GPUCompiler's IR, locally)
      - name: Compare the ports with Julia's passes
        if: startsWith(matrix.version, '1.12') || endsWith(matrix.version, 'nightly')
        run: |
          julia --project=test/differential test/differential/corpus.jl corpus
          julia --project=test/differential test/differential/run.jl --quiet --out differential julia-src/test/llvmpasses corpus test/differential/inputs
      # the diffs and the worker log of a failing comparison
      - uses: actions/upload-artifact@v4
        if: failure() && (startsWith(matrix.version, '1.12') || endsWith(matrix.version, 'nightly'))
        with:
          name: differential-${{ matrix.version }}
          path: differential

  # A standalone LLVM 23 (LLVM.jl's `deps/build_standalone.jl`: LLVM_full_jll linked with
  # LLVMExtra), with the LLVM 23 tools that the tests need next to it, for the mode-B and
  # oracle jobs. It is only built when the cache misses, i.e. when the LLVM.jl release,
  # the LLVM version or the runner image change.
  standalone-llvm:
    name: Standalone LLVM 23
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      oracle: ${{ steps.changes.outputs.oracle }}
    env:
      LLVM_VERSION: '23.1.4'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # to find the changed files
      # the oracle runs when what it validates changes: the harness, the pins, the patches
      # and their generator (test/upstream), or this workflow
      - name: Determine whether the oracle runs
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          oracle=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] &&
             git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD |
              grep -qE '^(test/upstream/|test/litsetup\.jl|bin/jlopt|\.github/workflows/CI\.yml)' ||
              oracle=false
          fi
          echo "oracle=$oracle" >> "$GITHUB_OUTPUT"
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      # the LLVM.jl release that the package resolves to, which the mode-b jobs load: the
      # library contains its LLVMExtra
      - name: Install LLVM.jl
        id: llvm-jl
        shell: julia --project --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
          llvm = only(p for p in values(Pkg.dependencies()) if p.name == "LLVM")
          open(ENV["GITHUB_OUTPUT"], "a") do io
              println(io, "dir=", llvm.source)
              println(io, "version=", llvm.version)
          end
      # the build's inputs; bump the revision when the steps below change what they produce
      - name: Determine the cache key
        id: key
        env:
          LLVM_JL: ${{ steps.llvm-jl.outputs.version }}
        run: echo "key=standalone-llvm$LLVM_VERSION-r2-llvmjl$LLVM_JL-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: standalone
          key: ${{ steps.key.outputs.key }}
      # from a copy of the installed package's deps/, as the script instantiates its
      # environment there
      - name: Build the standalone library
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          LLVM_JL: ${{ steps.llvm-jl.outputs.dir }}
        run: |
          cp -r "$LLVM_JL/deps" "$RUNNER_TEMP/llvm-deps"
          chmod -R u+w "$RUNNER_TEMP/llvm-deps"
          julia --project="$RUNNER_TEMP/llvm-deps" "$RUNNER_TEMP/llvm-deps/build_standalone.jl" "$LLVM_VERSION" "$PWD/standalone"
      # LLVM_full_jll's tools find libLLVM in ../lib (the build step downloaded the JLL)
      - name: Add the LLVM tools
        if: steps.cache.outputs.cache-hit != 'true'
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp=true)
          Pkg.add(; name="LLVM_full_jll", version=ENV["LLVM_VERSION"])
          using LLVM_full_jll
          src = LLVM_full_jll.artifact_dir
          mkpath("standalone/tools")
          for tool in ("opt", "FileCheck", "not", "count", "llvm-dis", "llvm-as")
              cp(joinpath(src, "tools", tool), joinpath("standalone/tools", tool))
          end
          for lib in readdir(joinpath(src, "lib"))
              # the versioned name that the tools link, not the unversioned symlink
              startswith(lib, "libLLVM.so.") || continue
              cp(joinpath(src, "lib", lib), joinpath("standalone/lib", lib); follow_symlinks=true)
          end
          run(`standalone/tools/llvm-dis --version`)
      # an archive, as artifacts don't keep the tools' permissions
      - name: Archive the library and tools
        run: tar -cf standalone.tar standalone
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-llvm
          path: standalone.tar
          retention-days: 1

  # Julia's pass tests and the package tests with the ports on the standalone LLVM, for
  # the IR of a pinned Julia (mode B; see the documentation's "Testing" page). Julia
  # itself runs on its own LLVM, which produces the IR.
  #
  # Only the LTS: old IR on a newer LLVM is what GPUCompiler does, and where the ports
  # broke (LowerExcHandlers' lifetime markers on an addrspace cast, which LLVM 22's
  # verifier rejects); the LTS has the oldest IR of a supported release, and the nightly
  # `test` and `upstream` jobs cover new IR on LLVM 23. Any pin of `upstream` can be added.
  mode-b:
    name: Julia ${{ matrix.version }} on LLVM 23 - mode B
    needs: standalone-llvm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:  # pins of the `upstream` job
          - {version: '1.10.12', julia_ref: 'd93beab124c850d5f600f290069853e81413f7ca'}  # v1.10.12
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      # a pin whose Julia uses LLVM 23 tests a standalone build of its own LLVM version; one
      # that uses a newer LLVM needs the standalone LLVM to follow
      - name: Check that the standalone LLVM is not older than Julia's
        run: |
          julia --startup-file=no -e 'Base.libllvm_version.major <= 23 ||
              error("Julia uses LLVM $(Base.libllvm_version), newer than the standalone LLVM 23; update the standalone-llvm job")'
      - uses: actions/download-artifact@v5
        with:
          name: standalone-llvm
          path: ${{ runner.temp }}
      - name: Unpack the standalone LLVM
        run: tar -xf standalone.tar
        working-directory: ${{ runner.temp }}
      - uses: julia-actions/cache@v3
      # first next to Julia's LLVM, selected after loading the package, as GPUCompiler does
      - name: Run the in-process tests with the standalone LLVM next to Julia's
        run: julia --project -e 'using Pkg; Pkg.test()'
        env:
          JULIAIR_TEST_LIBRARY: ${{ runner.temp }}/standalone/lib/libLLVM-standalone-23.so
      # LLVM.jl's `libLLVM` preference selects the library, in every environment that
      # loads LLVM.jl; the lit tests need the tools of its LLVM version
      - name: Use the standalone LLVM
        run: |
          for dir in . test docs test/differential; do
            printf '[LLVM]\nlibLLVM = "%s"\n' "$RUNNER_TEMP/standalone/lib/libLLVM-standalone-23.so" > "$dir/LocalPreferences.toml"
          done
          echo "JULIAIR_LLVM_TOOLS=$RUNNER_TEMP/standalone/tools" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - name: Check that LLVM.jl uses the standalone LLVM
        run: |
          julia --project -e 'using LLVM; (!LLVM.julia_llvm && LLVM.version().major == 23) ||
              error("LLVM.jl uses LLVM $(LLVM.version()) (julia_llvm = $(LLVM.julia_llvm)) instead of the standalone LLVM 23")'
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
      - name: Determine the fixtures' commit
        id: fixtures
        run: |
          ref='${{ matrix.julia_ref }}'
          [ -n "$ref" ] || ref=$(julia --startup-file=no -e 'print(Base.GIT_VERSION_INFO.commit)')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: JuliaLang/julia
          ref: ${{ steps.fixtures.outputs.ref }}
          path: julia-src
          sparse-checkout: |
            test/llvmpasses
            test/testhelpers
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        # Julia 1.10 and 1.11 don't support workspaces
        run: julia --project=test -e 'using Pkg; VERSION < v"1.12" && Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Run the fixtures with the ports on the standalone LLVM
        run: julia --project=test test/upstream/run.jl julia-src --mode B

  # The upgrade oracle: Julia's C++ passes, on Julia's own LLVM, with their textual output
  # re-printed by LLVM 23's opt, against the fixtures with the mode-B patches. It checks
  # that the patches describe LLVM 23 rather than the ports, so it runs when they or the
  # harness change. Only for the LTS, like `mode-b`.
  oracle:
    name: Julia ${{ matrix.version }} - upgrade oracle for LLVM 23
    needs: standalone-llvm
    if: needs.standalone-llvm.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:  # pins of the `upstream` job
          - {version: '1.10.12', julia_ref: 'd93beab124c850d5f600f290069853e81413f7ca'}  # v1.10.12
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: actions/download-artifact@v5
        with:
          name: standalone-llvm
          path: ${{ runner.temp }}
      - name: Unpack the standalone LLVM
        run: tar -xf standalone.tar
        working-directory: ${{ runner.temp }}
      - name: Determine the fixtures' commit
        id: fixtures
        run: |
          ref='${{ matrix.julia_ref }}'
          [ -n "$ref" ] || ref=$(julia --startup-file=no -e 'print(Base.GIT_VERSION_INFO.commit)')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: JuliaLang/julia
          ref: ${{ steps.fixtures.outputs.ref }}
          path: julia-src
          sparse-checkout: |
            test/llvmpasses
            test/testhelpers
          sparse-checkout-cone-mode: true
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        # Julia 1.10 and 1.11 don't support workspaces
        run: julia --project=test -e 'using Pkg; VERSION < v"1.12" && Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Run the fixtures with Julia's passes, re-printed by LLVM 23
        run: julia --project=test test/upstream/run.jl julia-src --cpp --reprint "$RUNNER_TEMP/standalone/tools/opt"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
