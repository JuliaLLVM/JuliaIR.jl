name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13', 'nightly']
        os: ['ubuntu-latest', 'macOS-latest', 'windows-latest']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version != 'nightly' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version != 'nightly'
      - uses: codecov/codecov-action@v7
        if: matrix.version != 'nightly'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: lcov.info

  # Julia's own pass tests, at the commits pinned in test/upstream/manifest.toml (the
  # job checks that the refs here match), with the Julia build they belong to
  upstream:
    name: Julia ${{ matrix.version }} - upstream llvmpasses
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1.10.12', julia_ref: 'd93beab124c850d5f600f290069853e81413f7ca'}  # v1.10.12
          - {version: '1.11.9', julia_ref: '53a02c0720cdc5d7fc0f35447886dd14bb2491a6'}   # v1.11.9
          - {version: '1.12.7', julia_ref: '6d172b025e4befc4d274d9fbc9339917a8a86b65'}   # v1.12.7
          - {version: '1.13.2', julia_ref: '45b6d15e34bbd2003a31acce0b1847b63dad029c'}   # v1.13.2
          - {version: 'nightly', julia_ref: '54d14c8eb9e43ce9080eaa6cce6a74f1ece3921a'}  # master
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: JuliaLang/julia
          ref: ${{ matrix.julia_ref }}
          path: julia-src
          sparse-checkout: |
            test/llvmpasses
            test/testhelpers
          sparse-checkout-cone-mode: true
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        # Julia 1.10 and 1.11 don't support workspaces
        run: julia --project=test -e 'using Pkg; VERSION < v"1.12" && Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Run the fixtures with the ports
        run: julia --project=test test/upstream/run.jl julia-src --mode A
      - name: Run the fixtures with Julia's passes
        run: julia --project=test test/upstream/run.jl julia-src --cpp

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
